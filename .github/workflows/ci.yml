name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # generated/ is gitignored, so CI has no client until we make one.
      # generate never connects — a fake URL is enough to satisfy prisma.config.ts.
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm build

      # Unit tests only: no database, no argon2, no Nest container. They run
      # against fakes behind the ports, so they need nothing from this job.
      - run: pnpm --filter api test

  api-e2e:
    name: API end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codearena
          POSTGRES_PASSWORD: codearena
          POSTGRES_DB: codearena
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://codearena:codearena@localhost:5432/codearena?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      JWT_ACCESS_TTL: '900'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api exec prisma generate
      # The suite that proves rotation and reuse detection against a real
      # database. The script itself passes --runInBand: the suites share one
      # Postgres, so parallel workers would race on the same rows.
      - run: pnpm --filter api test:e2e

  dojo-content:
    name: Dojo content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dojo test:generators
      - run: pnpm --filter dojo test:diagrams
      # Every model answer must pass its own checks, every starter must fail,
      # and every ```exercise id in a guide must resolve. A broken check tells
      # the learner correct code is wrong, which is worse than no check.
      - run: pnpm --filter dojo test:guide-exercises
