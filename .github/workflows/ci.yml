name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Every job only reads the repository. Declared here so the token's power is
# visible in review instead of depending on a repository setting.
permissions:
  contents: read

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 24: Node 20 reached end of life in April 2026, and commitlint and
      # lint-staged need 22 or newer. Matches "engines" in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # generated/ is gitignored, so CI has no client until we make one.
      # generate never connects — a fake URL is enough to satisfy prisma.config.ts.
      - name: Generate Prisma client
        run: pnpm --filter api exec prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: pnpm lint
      - run: pnpm -r typecheck
      - run: pnpm build

      # Unit tests only: no database, no argon2, no Nest container. They run
      # against fakes behind the ports, so they need nothing from this job.
      - run: pnpm --filter api test

      # The worker has no test script yet. --if-present makes this a no-op
      # until it does, then runs its tests without anyone editing CI.
      - run: pnpm --filter worker run --if-present test

  api-e2e:
    name: API end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: codearena
          POSTGRES_PASSWORD: codearena
          POSTGRES_DB: codearena
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://codearena:codearena@localhost:5432/codearena?schema=public
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      JWT_ACCESS_TTL: '900'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma migrate deploy
      - run: pnpm --filter api exec prisma generate
      # The suite that proves rotation and reuse detection against a real
      # database. The script itself passes --runInBand: the suites share one
      # Postgres, so parallel workers would race on the same rows.
      - run: pnpm --filter api test:e2e

  dojo-content:
    name: Dojo content checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter dojo test:generators
      - run: pnpm --filter dojo test:diagrams
      # Every model answer must pass its own checks, every starter must fail,
      # and every ```exercise id in a guide must resolve. A broken check tells
      # the learner correct code is wrong, which is worse than no check.
      - run: pnpm --filter dojo test:guide-exercises
      # Spaced review's due-date rules, which the course quizzes now feed.
      - run: pnpm --filter dojo test:scheduling
      # Every written lesson: quiz options of equal length (the longest one
      # mustn't give the answer away), links that resolve, labs that exist,
      # warm-ups that point at real questions.
      - run: pnpm --filter dojo test:courses

  commits:
    name: Commit messages
    # The commit-msg hook runs on laptops, and --no-verify skips it. This is the
    # check nobody can skip: every commit the PR would bring onto main.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # The default checkout is one commit deep; commitlint needs the range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # commitlint needs no native builds, so no install script gets to run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: >-
          pnpm exec commitlint --verbose
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # The whole history, not just the tip: a secret deleted in a later commit
      # is still in the repository.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Reviewed false positives live in .gitleaksignore, one fingerprint each.
      - name: Scan the history with gitleaks
        run: >-
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo:ro" -w /repo
          zricethezav/gitleaks:v8.30.1 git . --redact --verbose
